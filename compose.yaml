services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-offenro}
      POSTGRES_USER: ${POSTGRES_USER:-offenro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-offenro}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-offenro} -d ${POSTGRES_DB:-offenro}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
