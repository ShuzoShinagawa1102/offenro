services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-offenro}
      POSTGRES_USER: ${POSTGRES_USER:-offenro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-offenro}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-offenro} -d ${POSTGRES_DB:-offenro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgweb:
    image: sosedoff/pgweb:0.17.0
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER:-offenro}:${POSTGRES_PASSWORD:-offenro}@postgres:5432/${POSTGRES_DB:-offenro}?sslmode=disable
    ports:
      - "${PGWEB_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
