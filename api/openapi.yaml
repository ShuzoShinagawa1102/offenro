openapi: 3.0.3

info:
  title: Offenro Protocol
  version: 0.1.0

paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/travel/hotels/search:
    post:
      operationId: searchTravelHotels
      summary: Search hotel offers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelHotelSearchRequest"
      responses:
        "200":
          description: Hotel offers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TravelHotelSearchResponse"

components:
  schemas:

    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string

    TravelHotelSearchRequest:
      type: object
      required:
        - destination
        - stay
        - guests
      properties:
        destination:
          $ref: "#/components/schemas/TravelHotelDestination"

        stay:
          $ref: "#/components/schemas/TravelHotelStay"

        guests:
          $ref: "#/components/schemas/TravelHotelGuests"

        filters:
          $ref: "#/components/schemas/TravelHotelFilters"

    TravelHotelDestination:
      type: object
      required:
        - prefecture_code
      properties:
        prefecture_code:
          type: string
          description: Japanese prefecture code
          example: "14"

    TravelHotelStay:
      type: object
      required:
        - check_in
        - check_out
      properties:
        check_in:
          type: string
          format: date

        check_out:
          type: string
          format: date

    TravelHotelGuests:
      type: object
      required:
        - adults
        - rooms
      properties:
        adults:
          type: integer
          minimum: 1

        rooms:
          type: integer
          minimum: 1

    TravelHotelFilters:
      type: object
      properties:
        max_price:
          type: integer
          format: int64
          minimum: 0

    TravelHotelSearchResponse:
      type: object
      required:
        - offers
      properties:
        offers:
          type: array
          items:
            $ref: "#/components/schemas/TravelHotelOffer"

    TravelHotelOffer:
      type: object
      required:
        - offer_id
        - merchant_id
        - domain
        - amount
        - currency
        - hotel
        - stay
      properties:
        offer_id:
          type: string

        merchant_id:
          type: string

        domain:
          type: string

        amount:
          type: integer
          format: int64

        currency:
          type: string

        hotel:
          $ref: "#/components/schemas/TravelHotelHotel"

        stay:
          $ref: "#/components/schemas/TravelHotelStay"

    TravelHotelHotel:
      type: object
      required:
        - hotel_id
        - name
        - prefecture_code
        - prefecture_name
        - city
      properties:
        hotel_id:
          type: string

        name:
          type: string

        prefecture_code:
          type: string

        prefecture_name:
          type: string

        city:
          type: string