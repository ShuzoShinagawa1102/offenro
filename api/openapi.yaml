openapi: 3.0.3

info:
  title: Offenro Protocol
  version: 0.1.0

paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /v1/travel/hotels/search:
    post:
      operationId: searchTravelHotels
      summary: Search hotel offers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TravelHotelSearchRequest"
      responses:
        "200":
          description: Hotel offers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchOffersResponse"

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string

    TravelHotelSearchRequest:
      type: object
      required:
        - location
        - check_in
        - check_out
        - adults
        - rooms
      properties:
        location:
          type: string

        check_in:
          type: string
          format: date

        check_out:
          type: string
          format: date

        adults:
          type: integer
          minimum: 1

        rooms:
          type: integer
          minimum: 1

        max_price:
          type: integer
          format: int64
          minimum: 0

    SearchOffersResponse:
      type: object
      required:
        - offers
      properties:
        offers:
          type: array
          items:
            $ref: "#/components/schemas/Offer"

    Offer:
      type: object
      required:
        - offer_id
        - merchant_id
        - domain
        - title
        - amount
        - currency
      properties:
        offer_id:
          type: string

        merchant_id:
          type: string

        domain:
          type: string

        title:
          type: string

        amount:
          type: integer
          format: int64

        currency:
          type: string