openapi: 3.0.3

info:
  title: Offenro retail.shoes Schemas
  version: 0.1.0

paths: {}

components:
  schemas:
    RetailShoesCriteria:
      type: object
      required:
        - brand
        - size
      properties:
        brand:
          type: string
          example: example-brand
        size:
          type: string
          description: Merchant-defined shoe size notation
          example: "27.0"
        category:
          type: string
          example: sneakers

    RetailShoesFilters:
      type: object
      properties:
        max_price:
          $ref: "../../common/schemas.yaml#/components/schemas/Amount"

    RetailShoesSearchRequest:
      type: object
      required:
        - criteria
        - quantity
      properties:
        criteria:
          $ref: "#/components/schemas/RetailShoesCriteria"
        quantity:
          type: integer
          minimum: 1
        filters:
          $ref: "#/components/schemas/RetailShoesFilters"

    RetailShoesProduct:
      type: object
      required:
        - product_id
        - name
        - brand
        - category
        - size
        - color
      properties:
        product_id:
          type: string
        name:
          type: string
        brand:
          type: string
        category:
          type: string
        size:
          type: string
        color:
          type: string

    RetailShoesOffer:
      type: object
      required:
        - offer_id
        - merchant_id
        - domain
        - amount
        - currency
        - product
        - quantity
        - offer_expires_at
      properties:
        offer_id:
          type: string
        merchant_id:
          type: string
        domain:
          type: string
        amount:
          $ref: "../../common/schemas.yaml#/components/schemas/Amount"
        currency:
          $ref: "../../common/schemas.yaml#/components/schemas/Currency"
        product:
          $ref: "#/components/schemas/RetailShoesProduct"
        quantity:
          type: integer
        offer_expires_at:
          type: string
          format: date-time

    RetailShoesSearchResponse:
      type: object
      required:
        - offers
      properties:
        offers:
          type: array
          items:
            $ref: "#/components/schemas/RetailShoesOffer"

    RetailShoesMerchantOffer:
      type: object
      required:
        - merchant_offer_ref
        - amount
        - currency
        - product
        - quantity
      properties:
        merchant_offer_ref:
          type: string
          description: Opaque Merchant reference used by Offenro for revalidation
        amount:
          $ref: "../../common/schemas.yaml#/components/schemas/Amount"
        currency:
          $ref: "../../common/schemas.yaml#/components/schemas/Currency"
        product:
          $ref: "#/components/schemas/RetailShoesProduct"
        quantity:
          type: integer
        offer_expires_at:
          type: string
          format: date-time

    RetailShoesMerchantSearchResponse:
      type: object
      required:
        - offers
      properties:
        offers:
          type: array
          items:
            $ref: "#/components/schemas/RetailShoesMerchantOffer"

    RetailShoesCatalogResponse:
      type: object
      required:
        - products
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/RetailShoesProduct"

    RetailShoesRevalidateRequest:
      type: object
      required: [merchant_offer_ref]
      properties:
        merchant_offer_ref:
          type: string

    RetailShoesRevalidateResponse:
      type: object
      required: [offer]
      properties:
        offer:
          $ref: "#/components/schemas/RetailShoesMerchantOffer"

    RetailShoesDeliveryDetails:
      type: object
      required: [recipient_name, country_code, postal_code, address_line1]
      properties:
        recipient_name:
          type: string
        country_code:
          type: string
          minLength: 2
          maxLength: 2
        postal_code:
          type: string
        address_line1:
          type: string
        address_line2:
          type: string

    RetailShoesOrderRequest:
      type: object
      required: [merchant_offer_ref, purchase_id, purchase_item_id, buyer_ref, details]
      properties:
        merchant_offer_ref:
          type: string
        purchase_id:
          type: string
        purchase_item_id:
          type: string
        buyer_ref:
          type: string
        details:
          $ref: "#/components/schemas/RetailShoesDeliveryDetails"

    RetailShoesOrderResult:
      type: object
      required: [merchant_order_ref, status]
      properties:
        merchant_order_ref:
          type: string
        status:
          type: string
          enum: [PENDING, CONFIRMED, REJECTED]
        failure_code:
          type: string
