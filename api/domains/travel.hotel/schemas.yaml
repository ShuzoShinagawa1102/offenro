openapi: 3.0.3

info:
  title: Offenro travel.hotel Schemas
  version: 0.1.0

paths: {}

components:
  schemas:
    TravelHotelDestination:
      type: object
      required:
        - prefecture_code
      properties:
        prefecture_code:
          type: string
          description: Japanese prefecture code
          example: "14"

    TravelHotelStay:
      type: object
      required:
        - check_in
        - check_out
      properties:
        check_in:
          type: string
          format: date
        check_out:
          type: string
          format: date

    TravelHotelGuests:
      type: object
      required:
        - adults
        - rooms
      properties:
        adults:
          type: integer
          minimum: 1
        rooms:
          type: integer
          minimum: 1

    TravelHotelFilters:
      type: object
      properties:
        max_price:
          $ref: "../../common/schemas.yaml#/components/schemas/Amount"

    TravelHotelSearchRequest:
      type: object
      required:
        - destination
        - stay
        - guests
      properties:
        destination:
          $ref: "#/components/schemas/TravelHotelDestination"
        stay:
          $ref: "#/components/schemas/TravelHotelStay"
        guests:
          $ref: "#/components/schemas/TravelHotelGuests"
        filters:
          $ref: "#/components/schemas/TravelHotelFilters"

    TravelHotel:
      type: object
      required:
        - hotel_id
        - name
        - prefecture_code
        - prefecture_name
        - city
      properties:
        hotel_id:
          type: string
        name:
          type: string
        prefecture_code:
          type: string
        prefecture_name:
          type: string
        city:
          type: string

    TravelHotelOffer:
      type: object
      required:
        - offer_id
        - merchant_id
        - domain
        - amount
        - currency
        - hotel
        - stay
        - offer_expires_at
      properties:
        offer_id:
          type: string
        merchant_id:
          type: string
        domain:
          type: string
        amount:
          $ref: "../../common/schemas.yaml#/components/schemas/Amount"
        currency:
          $ref: "../../common/schemas.yaml#/components/schemas/Currency"
        hotel:
          $ref: "#/components/schemas/TravelHotel"
        stay:
          $ref: "#/components/schemas/TravelHotelStay"
        offer_expires_at:
          type: string
          format: date-time

    TravelHotelSearchResponse:
      type: object
      required:
        - offers
      properties:
        offers:
          type: array
          items:
            $ref: "#/components/schemas/TravelHotelOffer"

    TravelHotelMerchantOffer:
      type: object
      required:
        - merchant_offer_ref
        - amount
        - currency
        - hotel
        - stay
      properties:
        merchant_offer_ref:
          type: string
          description: Opaque Merchant reference used by Offenro for revalidation
        amount:
          $ref: "../../common/schemas.yaml#/components/schemas/Amount"
        currency:
          $ref: "../../common/schemas.yaml#/components/schemas/Currency"
        hotel:
          $ref: "#/components/schemas/TravelHotel"
        stay:
          $ref: "#/components/schemas/TravelHotelStay"
        offer_expires_at:
          type: string
          format: date-time

    TravelHotelMerchantSearchResponse:
      type: object
      required:
        - offers
      properties:
        offers:
          type: array
          items:
            $ref: "#/components/schemas/TravelHotelMerchantOffer"

    TravelHotelCatalogResponse:
      type: object
      required:
        - hotels
      properties:
        hotels:
          type: array
          items:
            $ref: "#/components/schemas/TravelHotel"

    TravelHotelRevalidateRequest:
      type: object
      required: [merchant_offer_ref]
      properties:
        merchant_offer_ref:
          type: string

    TravelHotelRevalidateResponse:
      type: object
      required: [offer]
      properties:
        offer:
          $ref: "#/components/schemas/TravelHotelMerchantOffer"

    TravelHotelReservationDetails:
      type: object
      required: [lead_guest_name, email]
      properties:
        lead_guest_name:
          type: string
        email:
          type: string
          format: email

    TravelHotelReservationRequest:
      type: object
      required: [merchant_offer_ref, purchase_id, purchase_item_id, buyer_ref, details]
      properties:
        merchant_offer_ref:
          type: string
        purchase_id:
          type: string
        purchase_item_id:
          type: string
        buyer_ref:
          type: string
        details:
          $ref: "#/components/schemas/TravelHotelReservationDetails"

    TravelHotelReservationResult:
      type: object
      required: [merchant_order_ref, status]
      properties:
        merchant_order_ref:
          type: string
        status:
          type: string
          enum: [PENDING, CONFIRMED, REJECTED]
        failure_code:
          type: string
