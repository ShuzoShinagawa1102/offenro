openapi: 3.0.3

info:
  title: Offenro travel.hotel Merchant API
  version: 0.1.0

paths:
  /travel/hotel/catalog:
    get:
      operationId: getTravelHotelCatalog
      summary: Get the merchant hotel catalog
      responses:
        "200":
          description: Hotel catalog
          content:
            application/json:
              schema:
                $ref: "./schemas.yaml#/components/schemas/TravelHotelCatalogResponse"

  /travel/hotel/search:
    post:
      operationId: searchTravelHotelOffers
      summary: Search current hotel offers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/components/schemas/TravelHotelSearchRequest"
      responses:
        "200":
          description: Current hotel offers
          content:
            application/json:
              schema:
                $ref: "./schemas.yaml#/components/schemas/TravelHotelMerchantSearchResponse"
